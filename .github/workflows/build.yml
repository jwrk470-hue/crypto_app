name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk
        pip install buildozer kivy requests

    - name: Build APK with Buildozer
      run: |
        buildozer android release

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: crypto_agent_apk
        path: bin/*.apk
