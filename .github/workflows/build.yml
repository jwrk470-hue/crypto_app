name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev ccache zip unzip openjdk-17-jdk git python3-pip
          pip install --upgrade pip
          pip install buildozer kivy Cython

      - name: Accept Licenses & Pre-install Build Tools
        run: |
          # تجهيز مجلدات التراخيص وقبول جميع تراخيص Android SDK
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # قبول التراخيص في كافة المسارات المتوقعة
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | sdkmanager --licenses || true

      - name: Build APK with Buildozer
        run: |
          # تشغيل buildozer وتلقيم القبول التفاعلي لتراخيص SDK
          yes | buildozer android debug || yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto_agent_apk
          path: bin/*.apk
