name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev ccache zip unzip openjdk-17-jdk git python3-pip
          pip install --upgrade pip
          pip install buildozer kivy Cython

      - name: Build APK with Auto-Accept Licenses
        run: |
          # القبول التلقائي لكافة تراخيص Android SDK
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto_agent_apk
          path: bin/*.apk
