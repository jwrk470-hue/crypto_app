name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev ccache zip unzip openjdk-17-jdk git python3-pip
          pip install --upgrade pip
          pip install buildozer kivy Cython

      - name: Pre-accept SDK Licenses
        run: |
          # 1. قبول تراخيص النظام الأساسي
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # 2. إنشاء وتجهيز مسار التراخيص لـ Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # نسخ جميع ملفات التراخيص المقبولة من نظام GitHub إلى مجلد Buildozer
          if [ -d "$ANDROID_HOME/licenses" ]; then
            cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true
          fi

          # كتابة مفاتيح التراخيص المعيارية مباشرة
          LIC_FILE="~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"
          eval LIC_FILE_EXP=$LIC_FILE
          printf "24833b29137e6f86114e4000186d2861355201b7\n504667f4c05912d7331036a9f65fb8636914d4d6\n84831b9402111701a56d4130d972d2424fae0a29\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9d5514f83c2829b004d1fee\n" > "$LIC_FILE_EXP"

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto_agent_apk
          path: bin/*.apk
